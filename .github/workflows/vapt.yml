name: VAPT Scan

on:
  push:
    branches: [main, uat]
  pull_request:
    branches: [main, uat]
  workflow_dispatch:

concurrency:
  group: vapt-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  vapt:
    uses: cylab-africa/vapt-workflows/.github/workflows/vapt-throttled.yml@main
    secrets: inherit
    with:
      min-days-between-scans: '14'
      codeql-languages: '"javascript"'
      run-codeql: 'true'
      run-semgrep: 'true'
      run-dependency-audit: 'true'
      run-trivy-image: 'true'
      dockerfile-path: 'Dockerfile'
      docker-context: '.'
      run-hadolint: 'true'
      docker-build-args: |
        NEXT_PUBLIC_API_KEY=dummy
        NEXT_PUBLIC_API_URL=http://localhost
        NEXT_PUBLIC_APP_VERSION=0.0.0
        NEXT_PUBLIC_POSTHOG_HOST=http://localhost
        NEXT_PUBLIC_POSTHOG_KEY=dummy
      run-k8s-scans: 'false'
      fail-on-critical: 'false'
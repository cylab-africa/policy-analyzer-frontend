version: 2
updates:
  # Updates go to uat (staging) first, then reach main with the normal uat -> main merge.
  # Create the uat branch before merging this file, or Dependabot will report an error.
  - package-ecosystem: npm
    directory: /
    target-branch: uat
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    target-branch: uat
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    target-branch: uat
    schedule:
      interval: monthly
